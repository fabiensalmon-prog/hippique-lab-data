name: Entraînement et backtest

on:
  schedule:
    - cron: "40 3 * * 1"    # chaque lundi 04:40 Paris (et à la fin de chaque collecte)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy scipy
      - run: python3 -m hl.train
      - name: Enregistrer
        run: |
          git config user.name "hippique-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add models reports
          git diff --cached --quiet || git commit -q -m "Modèle et backtest $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*7)); done
