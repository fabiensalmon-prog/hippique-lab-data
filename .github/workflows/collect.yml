name: Collecte historique PMU

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "day (test d'une journée) ou backfill"
        default: day
      arg:
        description: "date AAAA-MM-JJ (mode day) ou nombre de jours (mode backfill)"
        default: "2026-11-02"
  schedule:
    - cron: "17 * * * *"   # toutes les heures : 30 jours de plus dans le passé, jusqu'au 01/11/2024

permissions:
  contents: write
  actions: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 collect/pmu_history.py backfill 30
          else
            python3 collect/pmu_history.py "${{ inputs.mode }}" "${{ inputs.arg }}"
          fi
      - name: Enregistrer
        run: |
          git config user.name "hippique-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Collecte $(date -u +%F) ${{ github.event_name }}"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*7)); done
      - name: Enchaîner le lot suivant
        if: github.event_name == 'schedule' || inputs.mode == 'backfill'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 -c "import json,sys; p=json.load(open('data/progress.json')); sys.exit(0 if p.get('oldest_done','9999') > '2024-11-01' else 1)"; then
            gh workflow run collect.yml -f mode=backfill -f arg=30 && echo "lot suivant lancé"
          else
            echo "historique complet"
          fi
